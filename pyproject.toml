[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soutui-image"
version = "0.2.11"
description = "分阶段实现生图网站操作和店铺后台图片上传的 Python 工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13", "uiautomation>=2.0.20,<3; sys_platform == 'win32'", "cryptography>=50,<51"]

[tool.setuptools.packages.find]
where = ["src"]
